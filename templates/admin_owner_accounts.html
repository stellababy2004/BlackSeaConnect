<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlackSea Connect | Owner Accounts</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    .admin-owner-accounts-page {
      background: linear-gradient(180deg, #f7f1e3 0%, #fdfaf2 100%);
      min-height: 100vh;
      color: #1f2937;
      padding: 32px 20px 48px;
    }
    .admin-owner-accounts-shell {
      max-width: 1120px;
      margin: 0 auto;
    }
    .admin-owner-accounts-card {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(155, 123, 47, 0.18);
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(31, 41, 55, 0.08);
      backdrop-filter: blur(18px);
      padding: 28px;
    }
    .admin-owner-accounts-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .admin-owner-accounts-table th,
    .admin-owner-accounts-table td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid rgba(31, 41, 55, 0.08);
      vertical-align: top;
    }
    .admin-owner-accounts-table th {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7a6328;
    }
    .admin-owner-accounts-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: #6b7280;
    }
    .admin-owner-accounts-chip {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(155, 123, 47, 0.1);
      color: #7a6328;
      font-size: 12px;
      font-weight: 700;
    }
    .admin-owner-accounts-empty {
      color: #6b7280;
      padding: 18px 0 4px;
    }
  </style>
</head>
<body class="admin-owner-accounts-page">
  <main class="admin-owner-accounts-shell">
    <section class="admin-owner-accounts-card">
      <div class="admin-owner-accounts-meta">
        <span class="admin-owner-accounts-chip">Admin</span>
        <span class="admin-owner-accounts-chip">Owner Accounts</span>
        <span class="admin-owner-accounts-chip">Count: {{ owner_accounts_count }}</span>
      </div>
      <h1>Owner Accounts</h1>
      <p>Loaded from <code>{{ owner_accounts_path }}</code></p>

      {% if owner_accounts %}
        <table class="admin-owner-accounts-table" aria-label="Owner accounts">
          <thead>
            <tr>
              <th>Email</th>
              <th>Created At</th>
            </tr>
          </thead>
          <tbody>
            {% for account in owner_accounts %}
              <tr>
                <td>{{ account.email }}</td>
                <td>{{ account.created_at }}</td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      {% else %}
        <p class="admin-owner-accounts-empty">No owner accounts found.</p>
      {% endif %}
    </section>
  </main>
</body>
</html>
