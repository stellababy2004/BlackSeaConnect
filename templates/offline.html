<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>You are offline | BlackSeaConnect</title>
  {% include 'partials/pwa_head.html' %}
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); background: #f5f7f6; color: #0f2345; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(100%, 520px); padding: 32px; border: 1px solid rgba(15,35,69,.1); border-radius: 24px; background: #fff; box-shadow: 0 18px 42px rgba(15,35,69,.1); }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 7px 11px; border-radius: 999px; background: #fff0f0; color: #8a2f2f; font-size: 12px; font-weight: 800; }
    .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #b33a3a; }
    h1 { margin: 18px 0 10px; font-size: clamp(2rem, 9vw, 3.2rem); letter-spacing: -.04em; }
    p { color: #40536e; line-height: 1.6; }
    a { display: inline-flex; min-height: 44px; align-items: center; margin-top: 12px; padding: 10px 16px; border-radius: 12px; background: #0f2345; color: #fff; font-weight: 750; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Offline</span>
    <h1>You are offline.</h1>
    <p>Cached dashboards and tasks remain available. You can read instructions, checklists, and property information, but changes are disabled until your connection returns.</p>
    <a href="/professionals/dashboard">Open cached dashboard</a>
  </main>
  {% include 'partials/pwa_runtime.html' %}
</body>
</html>
